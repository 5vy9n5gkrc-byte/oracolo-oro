name: Aggiorna Oracolo Oro

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-oracolo
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python oracolo.py

      - run: |
          git config user.name "oracolo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html storico_previsioni.json
          git diff --cached --quiet || git commit -m "Aggiornamento automatico dati"
          git push
